# fly.toml app configuration file generated for vozit-watermark-worker on 2026-09-25T02:51:28-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vozit-watermark-worker'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # Confirmed by direct testing: shared-cpu-1x genuinely isn't enough —
  # FFmpeg was correctly encoding (no filter errors) but dropped from
  # 24fps to under 3fps as it went, on a 1080x1920 video with ~23
  # overlapping drawtext filters active in one pass, and got killed by
  # the processing timeout well before finishing a 90s clip. Scale-to-
  # zero (min_machines_running = 0, above) means this only costs more
  # while an actual job is running, not while idle.
  size = 'shared-cpu-4x'
  memory = '2gb'
